name: Docker Publish (amd64/arm64)

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  # schedule:
  #   - cron: '34 8 * * *'
  push:
    branches: [ main ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  publish:
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
      security-events: write
    uses: BattelleEcology/github-actions-workflows/.github/workflows/docker-publish-gcp-multiarch.yaml@ec6c7e551b07fddd12bf9e870cdc1dfccb1c4b2d #v0.1.0
