name: Docker Publish (amd64/arm64)

# Builds with Docker's reusable github-builder workflow:
# https://github.com/docker/github-builder
# It builds each platform on its own native runner (amd64 on ubuntu, arm64 on
# ubuntu-arm), pushes by digest, merges the digests into a multi-arch manifest
# list, and signs the SLSA provenance attestations.

on:
  push:
    branches: [ master ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Use google registry
  GCP_ARTIFACT_HOST: ${{ vars.SHARED_WIF_LOCATON }}-docker.pkg.dev
  GCP_IMAGE: ${{ vars.SHARED_WIF_LOCATON }}-docker.pkg.dev/${{ vars.SHARED_WIF_PROJECT }}/${{ vars.SHARED_WIF_REPO }}/${{ github.event.repository.name }}

concurrency:
  # This concurrency group ensures that only one job in the group runs at a time.
  # If a new job is triggered, the previous one will be canceled.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned to a commit SHA like the other actions; Dependabot keeps it updated.
    uses: docker/github-builder/.github/workflows/build.yml@cbc9d42f8c89a55623392aadd03600965b80e963 # v1.18.1
    permissions:
      contents: read
      # Used for Google Workload Identity Federation, signing attestations,
      # and signing GitHub Actions cache entries.
      id-token: write
    # The env context isn't available to reusable workflow inputs, so the
    # registry paths are built from vars here.
    with:
      output: image
      platforms: linux/amd64,linux/arm64
      # PR images are pushed too (tagged pr-<n>), except from forks, which
      # can't authenticate to Google. This repo is itself a fork of
      # NYTimes/gcs-helper, so head.repo.fork is always true; compare the
      # repo name instead.
      push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      cache: true
      # Stamp the binary's --version with the image version from
      # docker/metadata-action (the git tag, branch or pr-<n>).
      build-args: |
        VERSION={{meta.version}}
      meta-images: |
        ${{ vars.SHARED_WIF_LOCATON }}-docker.pkg.dev/${{ vars.SHARED_WIF_PROJECT }}/${{ vars.SHARED_WIF_REPO }}/${{ github.event.repository.name }}
      meta-tags: |
        type=raw,value=main,enable=${{ github.ref_name == 'master' }}
        type=ref,event=branch
        type=ref,event=tag
        type=ref,event=pr
        type=sha
      # Apply the OCI labels and annotations (created, description, source,
      # url, revision, ...) from docker/metadata-action to the images and the
      # manifest list.
      set-meta-labels: true
      set-meta-annotations: true
      registry-identities: |
        - type: gcp-wif
          registry: ${{ vars.SHARED_WIF_LOCATON }}-docker.pkg.dev
          workload_identity_provider: ${{ vars.SHARED_WIF_PROVIDER }}
          service_account: ${{ vars.SHARED_WIF_SERVICE_ACCOUNT }}

  scan:
    name: Trivy vulnerability scan
    runs-on: ubuntu-latest
    needs:
      - build
    if: github.event_name == 'push'
    permissions:
      contents: read
      # Used for Google Workload Identity Federation
      id-token: write
      # allow trivy to report back
      security-events: write
    steps:
      # Not needed for the scan, but needed for google auth
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Handle Google pkg.dev login
      - name: 'Google auth'
        id: 'auth'
        uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093'
        with:
          workload_identity_provider: "${{ vars.SHARED_WIF_PROVIDER }}"
          service_account: "${{ vars.SHARED_WIF_SERVICE_ACCOUNT }}"
          token_format: 'access_token'

      # Login to google artifact registry
      - name: Log into registry ${{ env.GCP_ARTIFACT_HOST }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GCP_ARTIFACT_HOST }}
          username: 'oauth2accesstoken'
          password: ${{ steps.auth.outputs.access_token }}

      # Scan with trivy and import sarif
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # The manifest list digest pushed by the build job
          image-ref: "${{ env.GCP_IMAGE }}@${{ needs.build.outputs.digest }}"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: "trivy-results.sarif"
